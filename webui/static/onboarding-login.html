<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作者登录 · reg-factory</title><link rel="stylesheet" href="/static/onboarding.css"><script src="/static/onboarding-login.js" defer></script></head><body><a class="skip-link" href="#username">跳到登录</a><main class="login-shell"><section class="login-copy"><div class="brand">reg-factory <span class="badge">保护模式</span></div><p class="eyebrow">Google Cloud · P1b / B3</p><h1>先确认操作者，<br>再进入控制面。</h1><p class="muted">登录本机管理账号，不是 Google 账号。<br>本阶段只接通离线底座与合成任务。</p><ol class="steps"><li>认证与权限由服务端校验</li><li>敏感值默认不回显；任务操作记录审计</li><li>真实开通、支付及模型调用尚未接入</li></ol></section><section class="card login-card" aria-labelledby="login-title"><h2 id="login-title">操作者登录</h2><p class="muted">账号由管理员通过本机命令创建。此处不提供注册或权限修改。</p><div id="message" class="message" role="status" aria-live="polite" hidden></div><form id="login-form" method="post" action="/api/auth/login"><div class="field"><label for="username">本机用户名</label><input id="username" name="username" autocomplete="username" required maxlength="128"></div><div class="field"><label for="password">本机登录密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></div><button id="login-button" class="primary" type="submit" disabled>正在准备安全登录…</button></form><button id="retry" type="button" hidden>重新检查登录服务</button><p class="footnote divider">请勿在这里输入 Google 密码、银行卡信息或验证码。连接必须使用 HTTPS；登录失败不会自动重试。</p></section></main></body></html>
